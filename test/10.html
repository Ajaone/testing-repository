<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC D - Pointer Lock</title>
</head>
<body>

<h2>Pointer Lock + Fullscreen</h2>
<button onclick="run()">Run</button>

<script>
function run() {
  document.documentElement.requestFullscreen().then(() => {
    document.body.innerHTML = `
      <div style="background:#000;color:#fff;padding:10px;">
        https://google.com
      </div>
      <h1>Locked Screen</h1>
    `;

    setTimeout(() => {
      document.body.requestPointerLock();
    }, 2000);
  });
}
</script>

</body>
</html>
