<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC F - Exit + Nav Race</title>
</head>
<body>

<h2>Exit Fullscreen + Navigation Race</h2>
<button onclick="run()">Run</button>

<script>
function run() {
  document.documentElement.requestFullscreen().then(() => {
    setTimeout(() => {
      document.exitFullscreen();
      location.href = "about:blank";
    }, 2000);
  });
}
</script>

</body>
</html>
